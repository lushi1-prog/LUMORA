<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8f7">
<title>LUMORA 1 – stöd i vardagen</title>
<style>
:root{
 --ink:#173b35;--brand:#3f8f7d;--brand2:#2e7666;--bg:#f6f8f7;
 --card:#fff;--soft:#e8f3ef;--line:#d7e5e0;--muted:#63756f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;overflow-y:auto;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{width:min(1120px,100%);margin:0 auto;padding:10px 14px 60px}
.top{display:flex;align-items:center;gap:12px;padding:8px 0 12px}
.logo{width:48px;height:48px;border-radius:16px;background:#dceee8;display:grid;place-items:center;font-size:25px;flex:none}
.title{font-size:24px;font-weight:800}.subtitle{font-size:13px;color:var(--muted)}
.navrow{display:flex;align-items:center;gap:5px;width:100%;min-width:0}
.arrow{flex:0 0 38px;width:38px;height:44px;border:0;border-radius:13px;background:#e8efec;color:var(--ink);font-size:25px}
nav{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;min-width:0;flex:1;padding:3px 1px 12px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;touch-action:pan-x}
nav button{flex:0 0 auto;min-height:44px;padding:10px 13px;border:0;border-radius:13px;background:#e8efec;color:var(--ink);font-weight:800;white-space:nowrap;touch-action:manipulation}
nav button.active{background:var(--brand);color:#fff}
.page{display:none}.page.active{display:block}
.hero{background:linear-gradient(135deg,#e9f5f1,#dceee8);border-radius:26px;padding:23px 20px;margin:3px 0 18px}
.kicker{font-size:13px;font-weight:800;color:#44746a}.hero h1{font-size:34px;line-height:1.12;margin:5px 0 10px}.hero p{font-size:17px;margin:0;color:#31534d}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:21px}
.tile{width:100%;min-height:132px;text-align:left;padding:17px;color:var(--ink);touch-action:manipulation}
.tile .ico{font-size:29px}.tile strong{display:block;font-size:18px;margin:5px 0}.tile small{display:block;color:var(--muted);line-height:1.45}
.card{padding:18px}.card h2,.card h3{margin-top:0}
.btn{min-height:44px;border:0;border-radius:13px;padding:10px 15px;background:var(--brand);color:#fff;font-weight:800;touch-action:manipulation}
.btn.secondary{background:#e8efec;color:var(--ink)}
.back{border:0;background:transparent;color:var(--brand);font-weight:800;padding:7px 0;margin-bottom:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
textarea,input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;color:var(--ink)}
textarea{min-height:100px}
.detail{background:#fff;border:1px solid var(--line);border-radius:24px;padding:19px}
.progress{height:8px;border-radius:99px;background:#e2ece8;overflow:hidden;margin:8px 0 15px}.progress span{display:block;height:100%;background:var(--brand);width:20%}
.why{background:#edf6f2;border-radius:16px;padding:14px;margin-top:13px}
.chat{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.chathead{padding:17px;background:#e8f3ef}.chathead h2{margin:0}.chathead p{margin:3px 0 0;color:var(--muted)}
.messages{min-height:300px;max-height:520px;overflow-y:auto;padding:14px;background:#f8faf9;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:11px 13px;border-radius:16px;white-space:pre-wrap}.bot{background:#e6f1ed;align-self:flex-start}.user{background:var(--brand);color:#fff;align-self:flex-end}
.quick{display:flex;gap:7px;flex-wrap:wrap;padding:10px;border-top:1px solid var(--line)}.quick button{border:0;background:#edf3f1;border-radius:12px;padding:9px 11px;color:var(--ink)}
.chatbar{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border-top:1px solid var(--line)}
.contactgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 0 0}
@media(max-width:720px){
 .app{padding:9px 9px 50px}.grid,.contactgrid{grid-template-columns:1fr}.hero h1{font-size:29px}
 .chatbar{grid-template-columns:1fr}.chatbar .btn{width:100%}
 .actions{display:grid;grid-template-columns:1fr}.actions .btn{width:100%}
}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">✨</div><div><div class="title">LUMORA 1</div><div class="subtitle">Stöd i vardagen för föräldrar</div></div></header>

<div class="navrow">
<button class="arrow" type="button" onclick="navScroll(-260)" aria-label="Scrolla menyn åt vänster">‹</button>
<nav id="nav"></nav>
<button class="arrow" type="button" onclick="navScroll(260)" aria-label="Scrolla menyn åt höger">›</button>
</div>

<main id="main"></main>

<footer>
<strong>LUMORA 1</strong><br>
© Perparim Haziri · All rights reserved.
</footer>
</div>

<script>
'use strict';

const $=id=>document.getElementById(id);

const MENU=[
 ['home','Hem'],['situations','Situationer'],['chat','💬 Chatta med LUMORA'],
 ['children','Barn'],['history','Historik'],['patterns','Mönster'],['follow','Uppföljning'],
 ['reminders','Påminnelser'],['support','❤️ Stöd'],['contact','📞 Ta kontakt'],
 ['videos','🎬 Video'],['mood','💛 Mående'],['words','💬 Säg så här']
];

const S=[
 ['😤','Mitt barn får utbrott','När känslorna blir stora och det är svårt att nå fram.'],
 ['📱','Vi bråkar om mobilen/skärmen','När skärmen blir en återkommande konflikt.'],
 ['🛏️','Läggningen fungerar inte','När kvällarna blir långa, stressiga eller konfliktfyllda.'],
 ['🏫','Mitt barn vill inte gå till skolan','När skolan väcker motstånd, oro eller konflikter.'],
 ['💬','Mitt barn vill inte prata','När barnet drar sig undan eller stänger av.'],
 ['😟','Mitt barn verkar ledset','När du märker förändringar i humör eller beteende.'],
 ['🥊','Barnen slåss eller bråkar','När syskon eller andra barn hamnar i fysiska bråk.'],
 ['💊','Jag är orolig för droger','När du misstänker alkohol eller droger eller har hittat något som gör dig orolig.'],
 ['🍺','Alkohol','När du är orolig för barnets eller ungdomens alkoholvanor.'],
 ['🚬','Vape, snus och nikotin','När du upptäcker eller misstänker nikotinanvändning.'],
 ['🚨','Hot och hotfulla situationer','När hot eller skrämmande situationer uppstår.'],
 ['🧑‍🤝‍🧑','Mobbning eller utanförskap','När barnet blir retat, lämnat utanför eller illa behandlat.'],
 ['📸','Press om bilder på nätet','När barnet får press att skicka bilder eller material.'],
 ['👥','Problem med kompisar','När relationer, konflikter eller ensamhet blir svårt.'],
 ['🤥','När barnet ljuger','När du misstänker att barnet inte berättar hela sanningen.'],
 ['🏠','Vanliga vardagsbråk','När vardagen fastnar i tjat, stress eller små konflikter.'],
 ['🔥','Jag håller på att tappa tålamodet','När du själv blir överbelastad som förälder.'],
 ['👨‍👩‍👧','Olika regler mellan föräldrar','När vuxna har olika regler eller sätt att göra saker.'],
 ['👨‍👩‍👧','Bonusfamilj','När familjen förändras genom en ny partner eller nya familjemedlemmar.'],
 ['🍼','Nytt syskon','När ett nytt barn kommer och det äldre barnet reagerar.'],
 ['🗣️','Svordomar och respektlöst språk','När språket blir hårt och du vill sätta gränser utan att fastna i bråk.'],
 ['🔒','Gränser och säkerhet på nätet','När du oroar dig för kontakter, bilder eller hemligheter på nätet.'],
 ['❤️','Barnet skadar sig själv','När du ser tecken på självskada eller är mycket orolig.']
];

const STEP=[
 ['Stanna upp','Vad händer precis innan situationen blir svår? Vad gör barnet och vad gör du?','När du först förstår vad som händer blir det lättare att välja nästa steg.'],
 ['Sänk tempot','Gör situationen lite lugnare. När känslorna är starka är det svårt att lösa problemet.','När tempot sjunker blir det ofta lättare att lyssna och tänka.'],
 ['Välj ett sätt','Välj några enkla ord eller en liten handling som kan hjälpa.','En enkel sak är lättare att prova än att försöka lösa allt.'],
 ['Tänk efter','Vad fungerade? Vad vill du göra lite annorlunda nästa gång?','Små förändringar som går att upprepa är ofta lättare att få in i vardagen.'],
 ['Spara','Skriv kort vad du vill prova nästa gång.','När du sparar kan du komma tillbaka och se vad du provade.']
];

const ANSWERS=[
 [/utbrott|arg|raseri|skriker|slår/,'När känslorna är stora: försök först att sänka tempot. Bekräfta känslan och håll en viktig gräns lugnt. När barnet har lugnat sig kan ni prata om vad som hände.'],
 [/mobil|skärm|telefon/,'Försök göra reglerna tydliga i förväg och undvik långa diskussioner precis när skärmen ska stängas.'],
 [/skola|skolvägr|ont i magen/,'Försök förstå vad som gör skolan svår innan fokus bara blir på frånvaron. Prata med barnet och ta vid behov kontakt med skolan eller elevhälsan.'],
 [/prata|berätta|stäng av/,'Pressa inte barnet att berätta allt på en gång. Du kan säga: ”Du behöver inte berätta allt nu. Jag finns här när du vill prata.”'],
 [/slåss|syskon|bråkar/,'Börja med tryggheten. Stoppa det fysiska bråket lugnt och separera om det behövs. När alla lugnat sig kan du försöka förstå vad som hände.'],
 [/drog|cannabis|narkot|vape|snus|alkohol/,'Försök prata när situationen är lugn. Börja med din oro snarare än anklagelser. Vid tydlig oro eller risk kan professionellt stöd behövas.'],
 [/ledsen|orolig|drar sig undan/,'Lägg märke till förändringar över tid. Försök vara nära utan att pressa. Om barnet mår tydligt sämre kan professionellt stöd behövas.'],
 [/hot|hotar/,'Ta hot på allvar. Försök skapa trygghet och avstånd från situationen. Vid akut fara ska du söka akut hjälp.'],
 [/mobb|utanför|retad/,'Lyssna på barnet och dokumentera vad som händer. Ta kontakt med skolan om det gäller skolan och be om en konkret plan.']
];

function navScroll(n){ $('nav').scrollBy({left:n,behavior:'smooth'}); }

function page(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 const target=$(id);
 if(target) target.classList.add('active');
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));
 window.scrollTo({top:0,behavior:'smooth'});
}

function buildNav(){
 $('nav').innerHTML=MENU.map(m=>`<button type="button" data-page="${m[0]}" onclick="page('${m[0]}')">${m[1]}</button>`).join('');
}

function situationsHtml(targetId){
 $(targetId).innerHTML=S.map((s,i)=>`
 <button type="button" class="tile" onclick="openSituation(${i})">
   <span class="ico">${s[0]}</span>
   <strong>${s[1]}</strong>
   <small>${s[2]}</small>
 </button>`).join('');
}

function openSituation(i){
 window._sit=i;window._step=0;
 $('situation').innerHTML=`
 <button type="button" class="back" onclick="page('situations')">← Alla situationer</button>
 <div class="hero"><div class="kicker">${S[i][0]} Situation</div><h1>${S[i][1]}</h1><p>${S[i][2]}</p></div>
 <div class="detail">
  <div class="progress"><span id="bar"></span></div>
  <b id="stepNo"></b><h2 id="stepTitle"></h2><p id="stepText"></p>
  <div class="why"><b>💡 Varför?</b><p id="stepWhy"></p></div>
  <div id="saveArea"></div>
  <div class="actions"><button type="button" class="btn secondary" onclick="prevStep()">← Föregående</button><button type="button" class="btn" onclick="nextStep()" id="nextStep">Nästa steg →</button></div>
 </div>`;
 page('situation');renderStep();
}

function renderStep(){
 const n=window._step;
 $('stepNo').textContent=`Steg ${n+1} av 5`;
 $('stepTitle').textContent=STEP[n][0];
 $('stepText').textContent=STEP[n][1];
 $('stepWhy').textContent=STEP[n][2];
 $('bar').style.width=((n+1)*20)+'%';
 $('nextStep').textContent=n===4?'💾 Spara och följ upp':'Nästa steg →';
 $('saveArea').innerHTML=n===4?`<textarea id="plan" placeholder="Skriv kort vad du vill prova nästa gång"></textarea>`:'';
}

function nextStep(){
 if(window._step<4){window._step++;renderStep();return;}
 const h=get('history',[]);
 h.unshift({title:S[window._sit][1],text:($('plan')?.value||'Ett litet steg att prova nästa gång.'),date:new Date().toLocaleString('sv-SE')});
 put('history',h.slice(0,100));page('follow');renderFollow();
}
function prevStep(){if(window._step>0){window._step--;renderStep();}else page('situations');}

function get(k,d=[]){try{return JSON.parse(localStorage.getItem('lumora_'+k)||JSON.stringify(d));}catch{return d;}}
function put(k,v){try{localStorage.setItem('lumora_'+k,JSON.stringify(v));}catch{}}

function sendChat(){
 const input=$('chatInput');const text=input.value.trim();if(!text)return;
 addMessage(text,'user');input.value='';
 setTimeout(()=>addMessage(answer(text),'bot'),120);
}
function quick(t){$('chatInput').value=t;sendChat();}
function addMessage(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;}
function answer(q){q=q.toLowerCase();for(const [re,a] of ANSWERS)if(re.test(q))return a;return 'Börja med att stanna upp och beskriva vad som händer just nu. Vad gör barnet, vad gör du och vad hände precis innan? Välj sedan ett litet steg som känns möjligt att prova.';}

function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function renderFollow(){
 const h=get('history',[]);
 $('followList').innerHTML=h.length?h.slice(0,30).map(x=>`<div class="card"><b>${esc(x.title)}</b><p>${esc(x.text)}</p><small>${esc(x.date)}</small></div>`).join(''):'<div class="card">Inget sparat ännu.</div>';
}
function renderHistory(){
 const h=get('history',[]);
 $('historyList').innerHTML=h.length?h.map(x=>`<div class="card"><b>${esc(x.title)}</b><p>${esc(x.text)}</p><small>${esc(x.date)}</small></div>`).join(''):'<div class="card">Du har inte sparat något ännu.</div>';
}

function boot(){
 buildNav();
 $('main').innerHTML=`
 <section id="home" class="page active">
  <div class="hero"><div class="kicker">Din digitala kompass</div><h1>Stöd i vardagen för föräldrar</h1><p>LUMORA hjälper dig att stanna upp, förstå situationen och hitta ett litet nästa steg.</p></div>
  <div class="grid">
   <button type="button" class="tile" onclick="page('chat')"><span class="ico">💬</span><strong>Chatta med LUMORA</strong><small>Skriv vad som händer och få ett enkelt svar.</small></button>
   <button type="button" class="tile" onclick="page('situations')"><span class="ico">🧭</span><strong>Situationer</strong><small>Välj en vardagssituation och få stöd steg för steg.</small></button>
   <button type="button" class="tile" onclick="page('contact')"><span class="ico">📞</span><strong>Ta kontakt vid behov</strong><small>Se vägar till stöd när du behöver hjälp utifrån.</small></button>
   <button type="button" class="tile" onclick="page('support')"><span class="ico">❤️</span><strong>Stöd</strong><small>Olika former av stöd för dig och barnet.</small></button>
  </div>
  <h2>Vanliga situationer</h2><div id="homeSituations" class="grid"></div>
 </section>

 <section id="situations" class="page"><div class="hero"><div class="kicker">LUMORA</div><h1>Välj en situation</h1><p>Tryck på det som ligger närmast det du upplever just nu.</p></div><div id="allSituations" class="grid"></div></section>

 <section id="situation" class="page"></section>

 <section id="chat" class="page">
  <div class="hero"><div class="kicker">Din digitala kompass 💬</div><h1>Chatta med LUMORA</h1><p>Berätta med dina egna ord. Du behöver inte skriva på något särskilt sätt.</p></div>
  <div class="chat"><div class="chathead"><h2>LUMORA</h2><p>Vi tar en sak i taget.</p></div>
   <div id="messages" class="messages"><div class="msg bot">Hej! 👋 Vad händer hemma just nu?</div></div>
   <div class="quick"><button type="button" onclick="quick('Mitt barn får utbrott')">Utbrott</button><button type="button" onclick="quick('Vi bråkar om mobilen')">Mobil</button><button type="button" onclick="quick('Mitt barn vill inte gå till skolan')">Skolan</button><button type="button" onclick="quick('Mina barn slåss')">Slåss/bråk</button><button type="button" onclick="quick('Jag är orolig för droger')">Droger</button></div>
   <div class="chatbar"><input id="chatInput" type="text" placeholder="Skriv din fråga här..."><button type="button" class="btn" onclick="sendChat()">Skicka</button></div>
  </div>
 </section>

 <section id="children" class="page"><div class="hero"><div class="kicker">LUMORA</div><h1>Barn</h1><p>Spara enkla anteckningar om vardagen.</p></div><div class="card"><input id="childName" placeholder="Barnets namn"><input id="childAge" placeholder="Ålder" style="margin-top:8px"><textarea id="childNote" placeholder="Anteckning" style="margin-top:8px"></textarea><div class="actions"><button type="button" class="btn" onclick="saveChild()">Spara</button></div></div><div id="childrenList" class="grid" style="margin-top:12px"></div></section>

 <section id="history" class="page"><div class="hero"><div class="kicker">LUMORA</div><h1>Historik</h1><p>Här finns det du har sparat.</p></div><div id="historyList" class="grid"></div></section>
 <section id="patterns" class="page"><div class="hero"><div class="kicker">LUMORA</div><h1>Mönster</h1><p>Se vilka situationer som återkommer.</p></div><div id="patternsList" class="grid"></div></section>
 <section id="follow" class="page"><div class="hero"><div class="kicker">LUMORA</div><h1>Uppföljning</h1><p>Se vad du provade och vad du vill göra nästa gång.</p></div><div id="followList" class="grid"></div></section>
 <section id="reminders" class="page"><div class="hero"><div class="kicker">LUMORA</div><h1>Påminnelser</h1><p>En enkel plats för saker du vill komma ihåg.</p></div><div class="card"><input id="remText" placeholder="Vad vill du komma ihåg?"><input id="remDate" type="date" style="margin-top:8px"><div class="actions"><button type="button" class="btn" onclick="saveReminder()">Spara</button></div></div><div id="reminderList" class="grid" style="margin-top:12px"></div></section>

 <section id="support" class="page"><div class="hero"><div class="kicker">LUMORA</div><h1>❤️ Stöd</h1><p>Du behöver inte lösa allt själv.</p></div><div class="contactgrid"><div class="card"><h3>💬 Föräldrasupport</h3><p>Stöd i föräldrarollen och vardagliga situationer.</p></div><div class="card"><h3>🏥 Vårdcentral</h3><p>För oro kring barnets hälsa eller mående.</p></div><div class="card"><h3>🧠 BUP</h3><p>Specialiserat stöd för barn och unga när det behövs.</p></div><div class="card"><h3>🏫 Skola/elevhälsa</h3><p>Vid skolfrånvaro, mobbning eller oro kring skolan.</p></div></div></section>

 <section id="contact" class="page"><div class="hero"><div class="kicker">LUMORA</div><h1>📞 Ta kontakt vid behov</h1><p>Ibland behöver man stöd från någon annan. Det är helt okej att be om hjälp.</p></div><div class="contactgrid"><div class="card"><h3>🏥 Vårdcentral</h3><p>För oro kring barnets hälsa eller mående.</p></div><div class="card"><h3>🧠 BUP</h3><p>För barn och unga som behöver mer specialiserat stöd.</p></div><div class="card"><h3>💬 Föräldrasupport</h3><p>För stöd i föräldrarollen och vardagen.</p></div><div class="card"><h3>🏫 Skola/elevhälsa</h3><p>Vid skolfrånvaro, mobbning eller andra skolproblem.</p></div><div class="card"><h3>🤝 Socialtjänst</h3><p>Om familjen behöver mer stöd från kommunen.</p></div><div class="card"><h3>🚨 Akut</h3><p>Vid akut fara ska du söka akut hjälp direkt.</p></div></div></section>

 <section id="videos" class="page"><div class="hero"><div class="kicker">LUMORA</div><h1>🎬 Video</h1><p>Korta filmer om vardag, känslor, gränser och föräldraskap.</p></div><div class="card"><h3>Video</h3><p>Här kan filmer kopplas in senare utan att ändra resten av LUMORA.</p></div></section>
 <section id="mood" class="page"><div class="hero"><div class="kicker">LUMORA</div><h1>💛 Mående</h1><p>Stanna upp och känn efter hur det är just nu.</p></div><div class="grid"><button type="button" class="tile" onclick="mood('Lugnt')"><span class="ico">🙂</span><strong>Lugnt</strong><small>Det känns ganska okej just nu.</small></button><button type="button" class="tile" onclick="mood('Oroligt')"><span class="ico">😟</span><strong>Oroligt</strong><small>Något känns svårt eller osäkert.</small></button><button type="button" class="tile" onclick="mood('Stressigt')"><span class="ico">😫</span><strong>Stressigt</strong><small>Det är mycket just nu.</small></button></div><div id="moodResult" class="card" style="margin-top:12px"></div></section>
 <section id="words" class="page"><div class="hero"><div class="kicker">LUMORA</div><h1>💬 Säg så här</h1><p>Enkla meningar när det är svårt att hitta orden.</p></div><div class="grid">
 <div class="card"><h3>😤 När barnet är argt</h3><p>”Jag ser att du är arg. Jag lyssnar när du är redo. Vi behöver fortfarande hålla den här gränsen.”</p></div>
 <div class="card"><h3>📱 När skärmen ska stängas</h3><p>”Jag vet att du vill fortsätta. Det är svårt att sluta när man har roligt. Nu är tiden slut.”</p></div>
 <div class="card"><h3>💬 När barnet inte vill prata</h3><p>”Du behöver inte berätta allt nu. Jag finns här när du vill prata.”</p></div>
 <div class="card"><h3>🏫 När barnet inte vill gå till skolan</h3><p>”Jag hör att det känns jobbigt. Vi behöver försöka förstå vad som gör det svårt.”</p></div>
 </div></section>
 `;
 situationsHtml('homeSituations');
 situationsHtml('allSituations');
 renderChildren();renderHistory();renderFollow();renderPatterns();renderReminders();
 $('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat();}});
}

function saveChild(){
 const n=$('childName').value.trim();if(!n){alert('Skriv barnets namn.');return}
 const a=get('children',[]);a.push({name:n,age:$('childAge').value,note:$('childNote').value});put('children',a);
 renderChildren();$('childName').value='';$('childAge').value='';$('childNote').value='';
}
function renderChildren(){const a=get('children',[]);$('childrenList').innerHTML=a.length?a.map(x=>`<div class="card"><h3>👤 ${esc(x.name)}</h3><p>${esc(x.age||'')} ${x.note?'<br>'+esc(x.note):''}</p></div>`).join(''):'<div class="card">Inga barn sparade ännu.</div>';}
function renderPatterns(){
 const h=get('history',[]),m={};h.forEach(x=>m[x.title]=(m[x.title]||0)+1);
 $('patternsList').innerHTML=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="card"><h3>${esc(x[0])}</h3><p>${x[1]} gång${x[1]===1?'':'er'} sparad.</p></div>`).join('')||'<div class="card">Spara några situationer så visas mönster.</div>';
}
function saveReminder(){
 const t=$('remText').value.trim(),d=$('remDate').value;if(!t||!d){alert('Fyll i text och datum.');return}
 const r=get('reminders',[]);r.unshift({text:t,date:d});put('reminders',r);renderReminders();$('remText').value='';$('remDate').value='';
}
function renderReminders(){const r=get('reminders',[]);$('reminderList').innerHTML=r.length?r.map(x=>`<div class="card"><h3>🔔 ${esc(x.text)}</h3><p>${esc(x.date)}</p></div>`).join(''):'<div class="card">Inga påminnelser ännu.</div>';}
function mood(x){$('moodResult').innerHTML=`<h3>Du valde: ${esc(x)}</h3><p>Det är okej att börja där du är. Välj ett litet nästa steg.</p>`;}

boot();
</script>
</body>
</html>
